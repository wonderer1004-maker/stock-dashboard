name: 매일 대시보드 자동 갱신

on:
  schedule:
    # UTC 22:00, 평일(월~금) = 미국 정규장 마감 이후, 한국 개장(09:00 KST) 이전
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}   # 저장소 Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 (CNN Fear&Greed + yfinance)
        run: python fetch_data.py

      - name: 대시보드(index.html) 생성
        run: python build_dashboard.py data.json index.html

      - name: 변경 사항 커밋 & 푸시
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add index.html data.json
          git diff --cached --quiet && echo "변경 없음, 커밋 생략" || git commit -m "chore: 대시보드 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
